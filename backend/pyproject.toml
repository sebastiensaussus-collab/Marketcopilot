[project]
name = "market-copilot-backend"
version = "0.1.0"
description = "Local data + calculator + synthesis backend for the personal market copilot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "yfinance>=0.2.43",
    "pandas>=2.2",
    "numpy>=1.26",
    "feedparser>=6.0.11",
    "anthropic>=0.39",
    "pydantic-settings>=2.5",
    "ib_async>=1.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
